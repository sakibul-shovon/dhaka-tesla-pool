server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense in depth alongside helmet on the API (plan §13.3) — the SPA
    # shell itself gets the same baseline headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    # Same-origin proxy to the API (plan §13.3: no CORS to reason about,
    # the session cookie stays first-party). Trailing slashes on both sides
    # keep the full downstream path intact.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA fallback — client-side routes (e.g. /p/rides/:id) are not real
    # files, so anything not matched above resolves to index.html.
    location / {
        try_files $uri /index.html;
    }
}
