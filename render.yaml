# Render Blueprint (plan §18.3) — exactly one web service. Migrations run as
# part of the start command, not a separate service or pre-deploy hook,
# since the free tier's 750 instance-hours/month only covers one always-on
# service.
#
# DATABASE_URL and WEB_ORIGIN are marked sync: false — fill them in from the
# Render dashboard once Neon and Netlify exist (this file can't know either
# URL in advance, and DATABASE_URL is a secret regardless).
services:
  - type: web
    name: dhaka-tesla-pool-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/v1/healthz
    # A bare `&&` chain here doesn't survive Render's own dockerCommand
    # parsing (confirmed live: both an unwrapped chain and a `sh -c '...'`
    # wrapper failed — the latter with "sh: 1: <the whole chain>: not
    # found", meaning quoting inside this field isn't reliably preserved
    # either way). A single unambiguous script path sidesteps all of it —
    # see apps/api/docker-start.sh for the migrate -> seed -> server steps.
    dockerCommand: "apps/api/docker-start.sh"
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      # Netlify proxy -> Render load balancer -> this service (plan §13.3).
      - key: TRUST_PROXY
        value: "2"
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
