name: CI

on:
  pull_request:
  push:
    branches: [master, pre-release]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dtp_test
          POSTGRES_PASSWORD: dtp_test
          POSTGRES_DB: dtp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtp_test -d dtp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dtp_test:dtp_test@localhost:5432/dtp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
