services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtp}
      POSTGRES_DB: ${POSTGRES_DB:-dtp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtp} -d ${POSTGRES_DB:-dtp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-dtp}:${POSTGRES_PASSWORD:-dtp}@db:5432/${POSTGRES_DB:-dtp}
      SEED_DEMO: ${SEED_DEMO:-true}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-dhaka-tesla-demo}
    command:
      [
        "sh",
        "-c",
        "node apps/api/dist/db/migrate.js && ( [ \"$SEED_DEMO\" = \"true\" ] && node apps/api/dist/db/seed/index.js || echo skipping seed )",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-dtp}:${POSTGRES_PASSWORD:-dtp}@db:5432/${POSTGRES_DB:-dtp}
      # One hop (nginx) in front of the api in this topology (plan §13.3).
      TRUST_PROXY: "1"
      WEB_ORIGIN: "http://localhost:8080"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — see apps/web/Dockerfile's own healthcheck
      # for why busybox wget + "localhost" is a false-negative here.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
